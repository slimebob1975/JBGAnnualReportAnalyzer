name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # No masking extra: the tests inject a fake NER pipeline instead of
          # downloading a BERT model, which keeps CI to seconds.
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # SKIP_PREFETCH keeps CI from pulling a multi-GB model; the point here
        # is that the Dockerfile still builds and the system packages resolve.
        run: docker build --build-arg SKIP_PREFETCH=1 -t jbg-analyzer:ci .
      - name: Verify the OCR system dependencies are present
        run: |
          docker run --rm --entrypoint sh jbg-analyzer:ci -c \
            'tesseract --list-langs | grep -q swe && gs --version && echo "ocr deps OK"'
