# Checks for the development branch.
#
# The application is not deployed anywhere yet, so this only guards the code:
# lint and tests on every push. The image build is a deployment concern and is
# therefore manual — run it from the Actions tab ("Run workflow"), or remove
# the `if:` line below once the service is actually deployed.
#
# If you are not pushing to GitHub, the same checks run locally:
#   ruff check app tests && pytest -q
# or ./run_checks.ps1 on Windows.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # No masking extra: the tests inject a fake NER pipeline instead of
          # downloading a BERT model, which keeps this to seconds.
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q

  docker:
    # Manual only, while there is no deployment. Delete this line to run the
    # image build on every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # SKIP_PREFETCH avoids pulling a multi-GB model; the point here is that
        # the Dockerfile still builds and the system packages resolve.
        run: docker build --build-arg SKIP_PREFETCH=1 -t jbg-analyzer:ci .
      - name: Verify the OCR system dependencies are present
        run: |
          docker run --rm --entrypoint sh jbg-analyzer:ci -c \
            'tesseract --list-langs | grep -q swe && gs --version && echo "ocr deps OK"'
