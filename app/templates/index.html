<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/javascript/script.js" defer></script>
    <link rel="icon" href="/static/favicon/favicon.ico" type="image/x-icon">
</head>
<body data-active-tab="{{ active_tab or 'analysis' }}">
    <div class="tab-container" role="tablist">
        <button type="button" class="tab-button" data-tab="analysis" role="tab" aria-selected="true">Nyckeltalsanalys</button>
        <button type="button" class="tab-button" data-tab="masking" role="tab" aria-selected="false">Maskning av .PDF</button>
    </div>

    <div id="analysis" class="tab-content active" role="tabpanel">
        <div id="wrapper">
            <h1>{{ title }}</h1>
            <h3><em>{{ subtitle }}</em></h3>

            <!-- action= keeps this working without JavaScript; script.js
                 intercepts submit and posts to /api/analyze instead. -->
            <form action="/upload" method="post" enctype="multipart/form-data"
                  data-kind="analysis" data-status="analysis-status"
                  data-busy="Analyserar årsredovisningar. Det tar några minuter.">
                <label for="fileloader">Välj fil att ladda upp:</label><br>
                <input type="file" name="file" id="fileloader" accept=".pdf,.zip" required>

                <input type="hidden" name="use_masking" value="no">
                <label><input type="checkbox" id="use_masking" name="use_masking" value="yes" checked> Använd maskning av egennamn, personnummer m.m.</label><br><br>

                <label for="apikey">Ange din OpenAI API-nyckel:</label><br>
                <input type="password" name="apikey" id="apikey" placeholder="sk-..." required><br>
                <small class="hint">
                    Din API-nyckel sparas endast i din webbläsare (lokalt) för bekvämlighet.
                </small>

                <label for="model">Välj GPT-modell:</label><br>
                <select name="model" id="model" required>
                    <option value="gpt-5.2" selected>gpt-5.2</option>
                    <option value="gpt-5.1">gpt-5.1</option>
                    <option value="gpt-5">gpt-5</option>
                    <option value="gpt-5-mini">gpt-5-mini</option>
                </select><br>

                <label>Svarsformat:</label><br>
                <div id="download-options">
                    <label><input type="radio" name="format" value="json" checked> JSON</label>
                    <label><input type="radio" name="format" value="csv"> CSV</label>
                    <label><input type="radio" name="format" value="xlsx"> Excel</label>
                    <input type="hidden" name="sources" value="no">
                    <label><input type="checkbox" id="sources" name="sources" value="yes" checked> Specificera källor</label>
                </div>

                <button type="submit">Ladda upp och analysera</button>
            </form>

            <div id="analysis-status" class="status-panel" hidden>
                <p class="status-line">
                    <span class="status-spinner" aria-hidden="true"></span>
                    <span data-role="message"></span>
                    <span class="status-elapsed" data-role="elapsed" hidden></span>
                </p>
            </div>

            <!-- Shown only by the no-JavaScript form fallback. -->
            <noscript>
                {% if message %}<p class="message">{{ message }}</p>{% endif %}
                {% if download_url %}
                    <p><a href="{{ download_url }}" download>Ladda ner resultatfil</a></p>
                {% endif %}
            </noscript>
        </div>
    </div>

    <div id="masking" class="tab-content" role="tabpanel">
        <div id="wrapper2">
            <h1>{{ title_masking }}</h1>
            <h3><em>{{ subtitle_masking }}</em></h3>

            <form action="/mask" method="post" enctype="multipart/form-data"
                  data-kind="masking" data-status="masking-status"
                  data-busy="Maskerar filen...">
                <label for="maskfile">Välj PDF att maskera:</label><br>
                <input type="file" name="file" id="maskfile" accept=".pdf" required><br><br>
                <button type="submit">Starta maskering</button>
            </form>

            <div id="masking-status" class="status-panel" hidden>
                <p class="status-line">
                    <span class="status-spinner" aria-hidden="true"></span>
                    <span data-role="message"></span>
                    <span class="status-elapsed" data-role="elapsed" hidden></span>
                </p>
            </div>

            <noscript>
                {% if message %}<p class="message">{{ message }}</p>{% endif %}
                {% if download_url %}
                    <p><a href="{{ download_url }}" download>Ladda ner maskerad fil</a></p>
                {% endif %}
            </noscript>
        </div>
    </div>
</body>
</html>
